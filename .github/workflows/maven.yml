# Nome do workflow no repositório
name: Integração continua de Java com Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Jobs do ambiente de desenvolvimento
  build-dev:
    # Runner com uma instância do ubuntu
    runs-on: ubuntu-24.04
    environment: 
      name: dev
    # Compila com diversas versões do JDK
    strategy:
      matrix: 
        java: [18]
    name: build-dev - Teste com JDK ${{ matrix.java }}
    steps:
    # Utiliza a action checkout para fazer o git clone no runner
    - name: Realiza o checkout do repositório
      uses: actions/checkout@v5
     # Utiliza a action setup-java para configurar a versão necessária do JDK
    - name: Configura o JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven
    # Executa a compilação e testes do projeto com o Maven no runner    
    - name: Compila o projeto com Maven
      run: mvn -B test --file pom.xml
  
 # Jobs do ambiente de homologação
  build-hmg:
    # Runner com uma instância do ubuntu      
    runs-on: ubuntu-24.04
    environment: 
      name: hmg
    needs: build-dev
    name: build-hmg - Análise do código
    steps:
    # Utiliza a action checkout para fazer o git clone no runner
    - name: Realiza o checkout do repositório
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 
    # Utiliza a action setup-java para configurar a versão necessária do JDK
    - name: Configura o JDK 18
      uses: actions/setup-java@v5      
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: maven     
    # Executa os passos da análise do código com o sonarcube     
    - name: Cache dos pacotes do SonarCloud
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    # Configura um cache as dependências do projeto, isso vai permitir 
    # que as próximas execuções do workflow sejam mais rápidas visto 
    # que as dependências já estarão disponibilizadas para o runner
    - name: Cache dos pacotes do Maven
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    # Executa a verificação do projeto com o Maven no runner    
    - name: Verifica o projeto com Maven e Jacoco
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     
     #run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=osmarbraz_controle_de_estoque_java #Default do Sonarcloud      
      run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=osmarbraz_controle_de_estoque_java org.jacoco:jacoco-maven-plugin:prepare-agent -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml 
                  
  # Jobs do ambiente de produção
  build-prd:
    runs-on: ubuntu-24.04
    environment: 
      name: prd
    needs: build-hmg
    steps:
    - name: Realiza o checkout do repositório
      uses: actions/checkout@v5
    - name: Configura o JDK 18
      uses: actions/setup-java@v5
      with:
        java-version: '18'
        distribution: 'temurin'
        cache: maven
    # Executa o empacotamento do projeto com o Maven. 
    # O parâmetro -DskipTests pula os testes pois já foram executados no ambiente anterior.
    - name: Empacota o projeto com Maven, cria a imagem docker e envia imagem para dockerhub.
      env:
        DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
        DOCKERHUB_TOKEN: ${{secrets.DOCKERHUB_TOKEN}}
      run: mvn -B package --file pom.xml jib:build -DskipTests     
    
    # Cria o artefato de download    
    - name: Crie uma pasta temporária de downloads de artefatos
      run: mkdir staging
    - name: Copia os artefatos a serem publicados na pasta temporária
      run: cp target/*.war staging
    - name: Usa Upload Artifact do GitHub Action
      uses: actions/upload-artifact@v4
      with:
        # Nome do arquivo a ser gerado
        name: Package-${{  runner.os }} #.zip será adicionado automaticamente
        # Caminho da pasta temporária (stating)
        path: staging     
